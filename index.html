        .pc {
            flex: 1;
            border-radius: 14px;
            padding: 16px 18px;
            position: relative;
            overflow: visible;
            backdrop-filter: blur(8px);
        }

        /* 优点框 - 绿色科技风 */
        .pc.good {
            border: 2px solid rgba(6, 252, 146, 0.6);
            color: var(--good);
            background:
                radial-gradient(ellipse 70% 60% at 5% 10%, rgba(6, 252, 146, 0.1), transparent),
                linear-gradient(155deg, rgba(4, 30, 20, 0.7), rgba(2, 16, 12, 0.5)),
                repeating-linear-gradient(0deg, rgba(6, 252, 146, 0.04) 0 1px, transparent 1px 32px),
                repeating-linear-gradient(90deg, rgba(6, 252, 146, 0.04) 0 1px, transparent 1px 32px);
            box-shadow:
                inset 0 0 0 1px rgba(6, 252, 146, 0.1),
                inset 0 0 24px rgba(6, 252, 146, 0.08),
                0 0 20px rgba(6, 252, 146, 0.1);
            animation: pcGoodPulse 3.6s ease-in-out infinite;
        }

        /* 缺点框 - 黄色科技风 */
        .pc.bad {
            border: 2px solid rgba(255, 191, 6, 0.55);
            color: var(--bad);
            margin-left: 0;
            background:
                radial-gradient(ellipse 70% 60% at 5% 10%, rgba(255, 191, 6, 0.08), transparent),
                linear-gradient(155deg, rgba(30, 22, 4, 0.7), rgba(16, 12, 2, 0.5)),
                repeating-linear-gradient(0deg, rgba(255, 191, 6, 0.04) 0 1px, transparent 1px 32px),
                repeating-linear-gradient(90deg, rgba(255, 191, 6, 0.04) 0 1px, transparent 1px 32px);
            box-shadow:
                inset 0 0 0 1px rgba(255, 191, 6, 0.1),
                inset 0 0 24px rgba(255, 191, 6, 0.06),
                0 0 20px rgba(255, 191, 6, 0.08);
            animation: pcBadPulse 3.6s ease-in-out infinite;
        }

        /* 通用角标 */
        .pc .pc-corner {
            position: absolute;
            width: 20px; height: 20px;
            z-index: 6; pointer-events: none;
        }
        .pc.good .pc-corner { border-color: #06fc92; animation: pcCornerPulseGreen 2.8s ease-in-out infinite; }
        .pc.bad  .pc-corner { border-color: #ffbf06; animation: pcCornerPulseYellow 2.8s ease-in-out infinite; }
        .pc .pc-corner.tl { top: -3px; left: -3px; border-top: 3px solid; border-left: 3px solid; }
        .pc .pc-corner.tr { top: -3px; right: -3px; border-top: 3px solid; border-right: 3px solid; animation-delay: .7s; }
        .pc .pc-corner.bl { bottom: -3px; left: -3px; border-bottom: 3px solid; border-left: 3px solid; animation-delay: 1.4s; }
        .pc .pc-corner.br { bottom: -3px; right: -3px; border-bottom: 3px solid; border-right: 3px solid; animation-delay: 2.1s; }
        .pc.good .pc-corner.tl { box-shadow: -2px -2px 8px rgba(6, 252, 146, 0.3); }
        .pc.good .pc-corner.tr { box-shadow: 2px -2px 8px rgba(6, 252, 146, 0.3); }
        .pc.good .pc-corner.bl { box-shadow: -2px 2px 8px rgba(6, 252, 146, 0.3); }
        .pc.good .pc-corner.br { box-shadow: 2px 2px 8px rgba(6, 252, 146, 0.3); }
        .pc.bad .pc-corner.tl { box-shadow: -2px -2px 8px rgba(255, 191, 6, 0.25); }
        .pc.bad .pc-corner.tr { box-shadow: 2px -2px 8px rgba(255, 191, 6, 0.25); }
        .pc.bad .pc-corner.bl { box-shadow: -2px 2px 8px rgba(255, 191, 6, 0.25); }
        .pc.bad .pc-corner.br { box-shadow: 2px 2px 8px rgba(255, 191, 6, 0.25); }

        /* conic旋转光边 */
        .pc .pc-conic {
            position: absolute; inset: -3px; border-radius: 16px;
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            padding: 2px; pointer-events: none; z-index: 1;
            animation: conicSpin 5s linear infinite; opacity: .7;
        }
        .pc.good .pc-conic {
            background: conic-gradient(from var(--conic-angle, 0deg),
                transparent 0%, rgba(6,252,146,.4) 8%, transparent 16%,
                transparent 50%, rgba(6,252,146,.22) 58%, transparent 66%);
        }
        .pc.bad .pc-conic {
            background: conic-gradient(from var(--conic-angle, 0deg),
                transparent 0%, rgba(255,191,6,.35) 8%, transparent 16%,
                transparent 50%, rgba(255,191,6,.2) 58%, transparent 66%);
        }

        /* SVG边框流光 */
        .pc .pc-trail-svg {
            position: absolute; inset: -6px;
            width: calc(100% + 12px); height: calc(100% + 12px);
            pointer-events: none; z-index: 5;
        }
        .pc .pc-trail-svg rect {
            fill: none; stroke-width: 2;
            stroke-dasharray: 50 300; stroke-linecap: round;
        }
        .pc.good .pc-trail-svg .pc-trail { stroke: url(#trailGradGreen); }
        .pc.good .pc-trail-svg .pc-trail-2 { stroke: url(#trailGradGreen); opacity: .5; }
        .pc.bad .pc-trail-svg .pc-trail { stroke: url(#trailGradYellow); }
        .pc.bad .pc-trail-svg .pc-trail-2 { stroke: url(#trailGradYellow); opacity: .5; }
        .pc .pc-trail-svg .pc-trail {
            filter: drop-shadow(0 0 5px currentColor);
            animation: pcTrailRun 8s linear infinite;
        }
        .pc .pc-trail-svg .pc-trail-2 {
            filter: drop-shadow(0 0 4px currentColor);
            animation: pcTrailRun 8s linear infinite;
            animation-delay: -4s;
        }

        /* 粒子 */
        .pc .pc-particles {
            position: absolute; inset: 0; overflow: hidden;
            border-radius: 14px; pointer-events: none; z-index: 1;
        }
        .pc .pc-particles .particle {
            position: absolute; width: 2px; height: 2px;
            border-radius: 50%; opacity: 0;
            animation: particleFloat 7s ease-in-out infinite;
        }
        .pc.good .pc-particles .particle { background: #06fc92; }
        .pc.bad  .pc-particles .particle { background: #ffbf06; }
        .pc .pc-particles .particle:nth-child(1) { left: 12%; bottom: -2px; animation-delay: 0s; animation-duration: 6s; }
        .pc .pc-particles .particle:nth-child(2) { left: 35%; bottom: -2px; animation-delay: 1.5s; animation-duration: 7s; width: 2.5px; height: 2.5px; }
        .pc .pc-particles .particle:nth-child(3) { left: 58%; bottom: -2px; animation-delay: 3s; animation-duration: 5.5s; }
        .pc .pc-particles .particle:nth-child(4) { left: 82%; bottom: -2px; animation-delay: 0.8s; animation-duration: 8s; width: 1.5px; height: 1.5px; }
        .pc .pc-particles .particle:nth-child(5) { left: 48%; bottom: -2px; animation-delay: 4s; animation-duration: 6.5s; }

        /* 电弧闪烁 */
        .pc .pc-flash {
            position: absolute; inset: 0; border-radius: 14px;
            pointer-events: none; z-index: 5; opacity: 0;
        }
        .pc.good .pc-flash {
            background: radial-gradient(ellipse at 30% 20%, rgba(6,252,146,.12), transparent 50%);
            animation: electricFlash 9s ease-in-out infinite;
        }
        .pc.bad .pc-flash {
            background: radial-gradient(ellipse at 70% 30%, rgba(255,191,6,.1), transparent 50%);
            animation: electricFlash 10s ease-in-out infinite;
            animation-delay: 5s;
        }

        /* 数据流线 */
        .pc .pc-stream {
            position: absolute; width: 1px;
            top: 0; bottom: 0;
            pointer-events: none; z-index: 1; opacity: .35;
        }
        .pc.good .pc-stream {
            background: repeating-linear-gradient(180deg, rgba(6,252,146,.3) 0px, rgba(6,252,146,.3) 3px, transparent 3px, transparent 10px);
            background-size: 1px 13px;
            animation: dataStreamUp 2.5s linear infinite;
        }
        .pc.bad .pc-stream {
            background: repeating-linear-gradient(180deg, rgba(255,191,6,.3) 0px, rgba(255,191,6,.3) 3px, transparent 3px, transparent 10px);
            background-size: 1px 13px;
            animation: dataStreamUp 2.8s linear infinite;
        }
        .pc .pc-stream.sl { left: -5px; }
        .pc .pc-stream.sr { right: -5px; animation-delay: 1.2s; opacity: .22; }

        /* 扫描线 */
        .pc .pc-scanline {
            position: absolute; inset: 0; overflow: hidden;
            border-radius: 14px; pointer-events: none; z-index: 2;
        }
        .pc .pc-scanline::after {
            content: ""; position: absolute;
            left: 0; right: 0; height: 2px;
            animation: scanlineDown 3.5s linear infinite;
        }
        .pc.good .pc-scanline::after {
            background: linear-gradient(90deg, transparent 5%, rgba(6,252,146,.08) 20%, rgba(6,252,146,.12) 50%, rgba(6,252,146,.08) 80%, transparent 95%);
        }
        .pc.bad .pc-scanline::after {
            background: linear-gradient(90deg, transparent 5%, rgba(255,191,6,.06) 20%, rgba(255,191,6,.1) 50%, rgba(255,191,6,.06) 80%, transparent 95%);
        }

        /* 发光圆点 */
        .pc .pc-dot {
            position: absolute;
            width: 4px; height: 4px; border-radius: 50%;
            z-index: 6; pointer-events: none;
        }
        .pc.good .pc-dot { background: #06fc92; box-shadow: 0 0 6px 2px rgba(6,252,146,.4); animation: pcDotGreen 2.2s ease-in-out infinite; }
        .pc.bad  .pc-dot { background: #ffbf06; box-shadow: 0 0 6px 2px rgba(255,191,6,.35); animation: pcDotYellow 2.2s ease-in-out infinite; }
        .pc .pc-dot.d1 { top: -4px; left: -4px; }
        .pc .pc-dot.d2 { top: -4px; right: -4px; animation-delay: .55s; }
        .pc .pc-dot.d3 { bottom: -4px; left: -4px; animation-delay: 1.1s; }
        .pc .pc-dot.d4 { bottom: -4px; right: -4px; animation-delay: 1.65s; }

        .youdian {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
            position: relative;
            z-index: 2;
        }

        .content {
            width: 100%;
            color: white;
            position: relative;
            z-index: 2;

            span {
                font-size: 26px;
                display: flex;
                align-items: center;
                margin-top: 6px;
                padding-left: 16px;
                position: relative;
                transition: all .25s;
            }
            span::before {
                content: '›';
                position: absolute;
                left: 0;
                font-size: 22px;
                opacity: .6;
            }
            span:hover {
                padding-left: 22px;
                text-shadow: 0 0 8px rgba(255,255,255,.15);
            }
        }

        .pc ul {
            margin: 0;
            padding-left: 18px
        }

        @keyframes pcGoodPulse {
            0%, 100% { box-shadow: inset 0 0 0 1px rgba(6,252,146,.1), inset 0 0 24px rgba(6,252,146,.08), 0 0 20px rgba(6,252,146,.1); }
            50%      { box-shadow: inset 0 0 0 1px rgba(6,252,146,.2), inset 0 0 40px rgba(6,252,146,.15), 0 0 32px rgba(6,252,146,.2); }
        }
        @keyframes pcBadPulse {
            0%, 100% { box-shadow: inset 0 0 0 1px rgba(255,191,6,.1), inset 0 0 24px rgba(255,191,6,.06), 0 0 20px rgba(255,191,6,.08); }
            50%      { box-shadow: inset 0 0 0 1px rgba(255,191,6,.18), inset 0 0 38px rgba(255,191,6,.12), 0 0 28px rgba(255,191,6,.16); }
        }
        @keyframes pcTrailRun {
            to { stroke-dashoffset: -700; }
        }
        @keyframes pcCornerPulseGreen {
            0%, 100% { opacity: .5; box-shadow: inherit; }
            50%      { opacity: 1; }
        }
        @keyframes pcCornerPulseYellow {
            0%, 100% { opacity: .5; }
            50%      { opacity: 1; }
        }
        @keyframes pcDotGreen {
            0%, 100% { transform: scale(1); opacity: .5; box-shadow: 0 0 6px 2px rgba(6,252,146,.3); }
            50%      { transform: scale(1.5); opacity: 1; box-shadow: 0 0 12px 4px rgba(6,252,146,.6); }
        }
        @keyframes pcDotYellow {
            0%, 100% { transform: scale(1); opacity: .5; box-shadow: 0 0 6px 2px rgba(255,191,6,.25); }
            50%      { transform: scale(1.5); opacity: 1; box-shadow: 0 0 12px 4px rgba(255,191,6,.5); }
        }

        /* 右侧 */
        .specs {
            width: 620px;
            position: relative;
            z-index: 0;
            border-radius: 14px;
        }

        .specs::before {
            content: "";
            position: absolute;
            inset: 0;
            border: 2px solid rgba(38, 255, 180, 0.75);
            border-radius: 14px;
            background:
                radial-gradient(130% 95% at 0% 0%, rgba(36, 255, 196, 0.16), transparent 55%),
                linear-gradient(160deg, rgba(5, 22, 21, 0.62), rgba(2, 15, 18, 0.48)),
                repeating-linear-gradient(0deg, rgba(44, 255, 219, 0.08) 0 1px, transparent 1px 40px),
                repeating-linear-gradient(90deg, rgba(44, 255, 219, 0.08) 0 1px, transparent 1px 40px);
            box-shadow:
                inset 0 0 0 1px rgba(143, 255, 220, 0.2),
                inset 0 0 34px rgba(24, 176, 131, 0.24),
                0 0 24px rgba(28, 210, 143, 0.2);
            pointer-events: none;
            z-index: 0;
        }

        .specs::after {
            content: "";
            position: absolute;
            top: 0;
            left: -38%;
            width: 20%;
            height: 100%;
            transform: skewX(-18deg);
            /* background: linear-gradient(90deg, transparent, rgba(111, 255, 219, 0.26), transparent); */
            filter: blur(1px);
            z-index: 1;
            pointer-events: none;
            clip-path: inset(0 round 12px);
        }

        .spec-grid {
            position: relative;
            z-index: 2;
            margin-top: 6px;
        }

        .spec {
            display: flex;
            gap: 12px;
            align-items: center;
            border-radius: 14px;
            padding: 12px;
            font-size: 28px;
            transition: color .25s ease, text-shadow .25s ease;

            img {
                width: 40px;
                height: 40px;
                filter: drop-shadow(0 0 8px rgba(70, 255, 205, 0.25));
                display: none;
            }

            div {
                margin-left: 8px;
            }
        }

        .spec:hover {
            color: #d7fff0;
            text-shadow: 0 0 9px rgba(130, 255, 219, 0.2);
        }

        .spec-frame-title {
            position: absolute;
            right: 12px;
            top: -58px;
            padding: 6px 20px;
            border-radius: 0 0 14px 14px;
            background: linear-gradient(90deg, #27f2a6, #4cfec3);
            color: #012018;
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 1px;
            box-shadow: 0 8px 18px rgba(57, 255, 188, 0.24);
            z-index: 3;
            pointer-events: none;
        }

        .tech-corner {
            position: absolute;
            width: 24px;
            height: 24px;
            border: 3px solid #2bffc0;
            z-index: 3;
            pointer-events: none;
        }

        .tech-corner.tl {
            top: -6px;
            left: -6px;
            border-right: 0;
            border-bottom: 0;
        }

        .tech-corner.tr {
            top: -6px;
            right: -6px;
            border-left: 0;
            border-bottom: 0;
        }

        .tech-corner.bl {
            bottom: -6px;
            left: -6px;
            border-right: 0;
            border-top: 0;
        }

        .tech-corner.br {
            bottom: -6px;
            right: -6px;
            border-left: 0;
            border-top: 0;
        }

        .people {
            color: #ddea00;
            height: 80px;
        }

        @keyframes framePulse {
            0%,
            100% {
                box-shadow:
                    inset 0 0 0 1px rgba(143, 255, 220, 0.2),
                    inset 0 0 34px rgba(24, 176, 131, 0.24),
                    0 0 22px rgba(28, 210, 143, 0.2);
            }

            50% {
                box-shadow:
                    inset 0 0 0 1px rgba(143, 255, 220, 0.32),
                    inset 0 0 52px rgba(24, 176, 131, 0.34),
                    0 0 34px rgba(45, 225, 160, 0.35);
            }
        }

        @keyframes frameScan {
            0% {
                left: -42%;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            70% {

        /* ============================================
           全局高级动效
           ============================================ */

        /* --- 1. SVG 边框流光（光点沿边框跑动）--- */
        .border-trail-svg {
            position: absolute;
            inset: -14px;
            width: calc(100% + 28px);
            height: calc(100% + 28px);
            pointer-events: none;
            z-index: 4;
        }
        .border-trail-svg rect {
            fill: none;
            stroke-width: 2;
            stroke-dasharray: 80 600;
            stroke-linecap: round;
        }
        .border-trail-svg .trail-green {
            stroke: url(#trailGradGreen);
            animation: borderTrailRun 10s linear infinite;
            filter: drop-shadow(0 0 6px rgba(43, 255, 192, 0.6));
        }
        .border-trail-svg .trail-green-2 {
            stroke: url(#trailGradGreen);
            animation: borderTrailRun 10s linear infinite;
            animation-delay: -5s;
            filter: drop-shadow(0 0 6px rgba(43, 255, 192, 0.4));
            opacity: .6;
        }
        .border-trail-svg .trail-blue {
            stroke: url(#trailGradBlue);
            animation: borderTrailRun 11s linear infinite;
            filter: drop-shadow(0 0 6px rgba(138, 158, 255, 0.6));
        }
        .border-trail-svg .trail-blue-2 {
            stroke: url(#trailGradBlue);
            animation: borderTrailRun 11s linear infinite;
            animation-delay: -5.5s;
            filter: drop-shadow(0 0 6px rgba(138, 158, 255, 0.4));
            opacity: .6;
        }
        @keyframes borderTrailRun {
            to { stroke-dashoffset: -1400; }
        }

        /* --- 2. 旋转 conic-gradient 光晕（specs 框） --- */
        .conic-glow {
            position: absolute;
            inset: -3px;
            border-radius: 16px;
            background: conic-gradient(from var(--conic-angle, 0deg),
                transparent 0%,
                rgba(43, 255, 192, 0.35) 8%,
                transparent 16%,
                transparent 50%,
                rgba(43, 255, 192, 0.2) 58%,
                transparent 66%
            );
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            padding: 2px;
            pointer-events: none;
            z-index: 1;
            animation: conicSpin 6s linear infinite;
            opacity: .8;
        }
        .conic-glow.blue {
            background: conic-gradient(from var(--conic-angle, 0deg),
                transparent 0%,
                rgba(138, 158, 255, 0.35) 8%,
                transparent 16%,
                transparent 50%,
                rgba(138, 158, 255, 0.2) 58%,
                transparent 66%
            );
        }
        @keyframes conicSpin {
            to { --conic-angle: 360deg; }
        }
        /* CSS Houdini for smooth conic rotation */
        @property --conic-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        /* --- 3. 粒子浮动效果 --- */
        .particle-field {
            position: absolute;
            inset: -14px;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
            border-radius: 14px;
        }
        .particle {
            position: absolute;
            width: 2px; height: 2px;
            background: #2bffc0;
            border-radius: 50%;
            opacity: 0;
            animation: particleFloat 8s ease-in-out infinite;
        }
        .particle-field.blue .particle { background: #8a9eff; }

        .particle:nth-child(1) { left: 10%; bottom: -4px; animation-delay: 0s; animation-duration: 7s; }
        .particle:nth-child(2) { left: 25%; bottom: -4px; animation-delay: 1.2s; animation-duration: 6s; width: 3px; height: 3px; }
        .particle:nth-child(3) { left: 45%; bottom: -4px; animation-delay: 2.8s; animation-duration: 8s; }
        .particle:nth-child(4) { left: 65%; bottom: -4px; animation-delay: 0.6s; animation-duration: 9s; width: 2.5px; height: 2.5px; }
        .particle:nth-child(5) { left: 80%; bottom: -4px; animation-delay: 3.5s; animation-duration: 7.5s; }
        .particle:nth-child(6) { left: 92%; bottom: -4px; animation-delay: 1.8s; animation-duration: 6.5s; width: 1.5px; height: 1.5px; }
        .particle:nth-child(7) { left: 35%; bottom: -4px; animation-delay: 4.2s; animation-duration: 8.5s; }
        .particle:nth-child(8) { left: 55%; bottom: -4px; animation-delay: 5s; animation-duration: 7s; width: 3px; height: 3px; }

        @keyframes particleFloat {
            0%   { transform: translateY(0); opacity: 0; }
            10%  { opacity: .8; }
            50%  { opacity: .4; }
            90%  { opacity: .7; }
            100% { transform: translateY(-500px); opacity: 0; }
        }

        /* --- 4. 电弧闪烁（specs 框偶尔闪一下） --- */
        .electric-flash {
            position: absolute;
            inset: 0;
            border-radius: 14px;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            background: radial-gradient(ellipse at 30% 20%, rgba(43, 255, 192, 0.15), transparent 50%);
            animation: electricFlash 8s ease-in-out infinite;
        }
        .electric-flash.blue {
            background: radial-gradient(ellipse at 70% 30%, rgba(138, 158, 255, 0.12), transparent 50%);
            animation-delay: 4s;
        }
        @keyframes electricFlash {
            0%, 88%, 100% { opacity: 0; }
            90%           { opacity: 1; }
            91%           { opacity: 0; }
            92%           { opacity: .8; }
            93%           { opacity: 0; }
            94%           { opacity: .5; }
            95%           { opacity: 0; }
        }

        /* --- 5. 数据流线（竖向虚线向上流动） --- */
        .data-stream {
            position: absolute;
            width: 1px;
            top: 0; bottom: 0;
            pointer-events: none;
            z-index: 1;
            background: repeating-linear-gradient(180deg,
                rgba(43, 255, 192, 0.3) 0px,
                rgba(43, 255, 192, 0.3) 4px,
                transparent 4px,
                transparent 12px
            );
            background-size: 1px 16px;
            animation: dataStreamUp 3s linear infinite;
            opacity: .4;
        }
        .data-stream.blue {
            background: repeating-linear-gradient(180deg,
                rgba(138, 158, 255, 0.3) 0px,
                rgba(138, 158, 255, 0.3) 4px,
                transparent 4px,
                transparent 12px
            );
            background-size: 1px 16px;
        }
        .data-stream.s1 { left: -8px; animation-duration: 2.5s; }
        .data-stream.s2 { right: -8px; animation-duration: 3.2s; animation-delay: 1s; opacity: .25; }

        @keyframes dataStreamUp {
            0%   { background-position: 0 0; }
            100% { background-position: 0 -48px; }
        }

        /* --- 6. 水平扫描线（类CRT效果） --- */
        .scanline-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            border-radius: 14px;
            overflow: hidden;
        }
        .scanline-overlay::after {
            content: "";
            position: absolute;
            left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg,
                transparent 5%,
                rgba(43, 255, 192, 0.08) 20%,
                rgba(43, 255, 192, 0.12) 50%,
                rgba(43, 255, 192, 0.08) 80%,
                transparent 95%);
            animation: scanlineDown 4s linear infinite;
        }
        .scanline-overlay.blue::after {
            background: linear-gradient(90deg,
                transparent 5%,
                rgba(138, 158, 255, 0.06) 20%,
                rgba(138, 158, 255, 0.1) 50%,
                rgba(138, 158, 255, 0.06) 80%,
                transparent 95%);
        }
        @keyframes scanlineDown {
            0%   { top: -2px; }
            100% { top: 100%; }
        }

            "品牌型号": "./img8/品牌型号.png",
            "用途": "./img8/特色功能-1.png",
            "出水方式": "./imgicon10/装修商家-水龙头.png",

            "过滤原理": "./imgicon10/过滤.png",
            "适用场景": "./imgicon9/适用场景.png"
        };

        // ============ 渲染逻辑 =============
        function renderProduct(data) {
            // 标题
            document.querySelector(".title").textContent = data.title;

            // 优缺点
            fillList(".pc.good .content", data.pros);
            fillList(".pc.bad  .content", data.cons);

            // 规格参数
            const specGrid = document.querySelector(".spec-grid");
            specGrid.innerHTML = "";
            data.specs.forEach(({ label, value, classExtra }) => {
                const spec = document.createElement("div");
                spec.className = "spec";
                const icon = iconMap[label] ? `<img src="${iconMap[label]}" alt="${label}">` : "";
                if (classExtra === "people") {
                    spec.innerHTML = `${icon}<div class="people">${label}：${value}</div>`;
                } else {
                    spec.innerHTML = `${icon}<div>${label}：${value}</div>`;
                }
                specGrid.appendChild(spec);
            });
        }

        function fillList(selector, arr) {
            const box = document.querySelector(selector);
            if (!box) return;
            box.innerHTML = "";
            arr.forEach(text => {
                const span = document.createElement("span");
                span.textContent = text;
                box.appendChild(span);
            });
        }

        // ============ 从配置面板读取数据并刷新 =============
        function applyConfig() {
            const specsText = document.getElementById("cfgSpecs").value.trim();
            const specs = [];
            specsText.split("\n").forEach(line => {
                const parts = line.split("|");
                if (parts.length >= 2) {
                    specs.push({ label: parts[0].trim(), value: parts[1].trim() });
                }
            });
            const audienceVal = document.getElementById("cfgAudience").value.trim();
            if (audienceVal) {
                specs.push({ label: "适用人群", value: audienceVal, classExtra: "people" });
            }

            const data = {
                title: document.getElementById("cfgTitle").value,
                pros: document.getElementById("cfgPros").value.split("\n").filter(s => s.trim()),
                cons: document.getElementById("cfgCons").value.split("\n").filter(s => s.trim()),
                specs: specs
            };

            renderProduct(data);
        }

        let panelOpen = false;
        const panel = document.getElementById("configPanel");
        const toggle = document.getElementById("cfgToggle");
        const closeBtn = document.getElementById("cfgClose");

            panelOpen = true;
            panel.style.right = "0";
            toggle.style.right = "480px";

            panelOpen = false;
            panel.style.right = "-480px";
            toggle.style.right = "0";
        }
        toggle.addEventListener("click", () => panelOpen ? closePanel() : openPanel());
        closeBtn.addEventListener("click", closePanel);

        // ============ 快捷键控制配置按钮显隐 (Ctrl+H) =============
        document.addEventListener("keydown", (e) => {
            if (e.ctrlKey && e.key.toLowerCase() === "h") {
                e.preventDefault();
                const isHidden = toggle.style.display === "none";
                if (isHidden) {
                    toggle.style.display = "flex";
                } else {
                    if (panelOpen) closePanel();
                    toggle.style.display = "none";
                }
            }
        });

        // ============ 导入TXT配置文件 =============
        const cfgImportBtn = document.getElementById("cfgImportBtn");
        const cfgFileInput = document.getElementById("cfgFileInput");
        cfgImportBtn.addEventListener("click", () => cfgFileInput.click());
        cfgFileInput.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const text = ev.target.result;
                const sections = {};
                let currentKey = null;
                text.split("\n").forEach(line => {
                    const trimmed = line.trim();
                    if (trimmed.startsWith("[") && trimmed.endsWith("]")) {
                        currentKey = trimmed.slice(1, -1).trim();
                        sections[currentKey] = [];
                    } else if (currentKey && trimmed) {
                        sections[currentKey].push(trimmed);
                    }
                });
                if (sections["标题"]) {
                    document.getElementById("cfgTitle").value = sections["标题"].join(" ");
                }
                if (sections["核心参数"]) {
                    document.getElementById("cfgSpecs").value = sections["核心参数"].join("\n");
                }
                if (sections["适用人群"]) {
                    document.getElementById("cfgAudience").value = sections["适用人群"].join(" ");
                }
                if (sections["优点"]) {
                    document.getElementById("cfgPros").value = sections["优点"].join("\n");
                }
                if (sections["缺点"]) {
                    document.getElementById("cfgCons").value = sections["缺点"].join("\n");
                }
                applyConfig();
                cfgImportBtn.textContent = "已导入：" + file.name;
                setTimeout(() => { cfgImportBtn.textContent = "点击导入 TXT 配置文件"; }, 2000);
            };
            reader.readAsText(file, "UTF-8");
            cfgFileInput.value = "";
        });

        // ============ 实时监听所有输入 =============
        document.querySelectorAll("#configPanel input, #configPanel textarea").forEach(el => {
            el.addEventListener("input", applyConfig);
        });

        // ============ 录制页面视频 =============
        (function () {
            const recordBtn = document.getElementById("cfgRecordBtn");
            const stopBtn = document.getElementById("cfgStopRecordBtn");
            const statusEl = document.getElementById("cfgRecordStatus");
            const durationInput = document.getElementById("cfgVideoDuration");

            let mediaRecorder = null;
            let recordedChunks = [];
            let recordTimer = null;
            let countdownTimer = null;

            recordBtn.addEventListener("click", startRecording);
            stopBtn.addEventListener("click", stopRecording);

            async function startRecording() {
                const duration = parseFloat(durationInput.value);
                if (!duration || duration <= 0 || duration > 10) {
                    statusEl.textContent = "请输入有效时长（0.1 ~ 10 分钟）";
                    statusEl.style.color = "#ff4d4f";
                    return;
                }

                // 录制前先关闭配置面板，避免录进去
                closePanel();

                // 等面板动画结束
                await new Promise(r => setTimeout(r, 400));

                // 隐藏配置按钮
                toggle.style.display = "none";

                try {
                    // 先弹出分享选择器（全屏前，避免分享对话框取消全屏）
                    const stream = await navigator.mediaDevices.getDisplayMedia({
                        video: { mediaSource: "screen", frameRate: 30 },
                        audio: false
                    });

                    // 选择完成后再进入全屏
                    try {
                        await document.documentElement.requestFullscreen();
                    } catch (e) {
                        console.warn("全屏请求失败:", e);
                    }
                    // 等全屏切换完成
                    await new Promise(r => setTimeout(r, 500));

                    recordedChunks = [];
                    // 优先 webm，后面转 mp4 下载；浏览器原生大多只支持 webm
                    const mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
                        ? "video/webm;codecs=vp9"
                        : "video/webm";
                    mediaRecorder = new MediaRecorder(stream, { mimeType });

                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) recordedChunks.push(e.data);
                    };

                    mediaRecorder.onstop = () => {
                        // 停止所有轨道
                        stream.getTracks().forEach(t => t.stop());
                        clearInterval(countdownTimer);

                        // 退出全屏
                        if (document.fullscreenElement) {
                            document.exitFullscreen().catch(() => {});
                        }

                        const blob = new Blob(recordedChunks, { type: mimeType });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement("a");
                        a.href = url;
                        // 浏览器原生录制为 webm，文件名标注；若需要 mp4 可用 FFmpeg 转换
                        a.download = "页面录制_" + new Date().toISOString().slice(0, 19).replace(/[T:]/g, "-") + ".webm";
                        document.body.appendChild(a);
                        a.click();
                        setTimeout(() => {
                            document.body.removeChild(a);
                            URL.revokeObjectURL(url);
                        }, 100);

                        // 恢复 UI
                        recordBtn.style.display = "";
                        stopBtn.style.display = "none";
                        statusEl.textContent = "录制完成，已自动下载！";
                        statusEl.style.color = "#1dd1a1";
                        toggle.style.display = "flex";
                    };

                    // 如果用户在分享选择器里点了取消，stream 轨道会直接 ended
                    stream.getVideoTracks()[0].onended = () => {
                        if (mediaRecorder && mediaRecorder.state !== "inactive") {
                            stopRecording();
                        }
                    };

                    mediaRecorder.start(1000); // 每秒收集一次数据

                    // UI 切换
                    recordBtn.style.display = "none";
                    stopBtn.style.display = "";
                    statusEl.style.color = "#ff4d4f";

                    // 倒计时
                    const totalSec = Math.round(duration * 60);
                    let remaining = totalSec;
                    statusEl.textContent = "录制中… 剩余 " + formatTime(remaining);
                    countdownTimer = setInterval(() => {
                        remaining--;
                        if (remaining <= 0) {
                            stopRecording();
                        } else {
                            statusEl.textContent = "录制中… 剩余 " + formatTime(remaining);
                        }
                    }, 1000);

                    // 到时自动停止
                    recordTimer = setTimeout(() => stopRecording(), totalSec * 1000);

                } catch (err) {
                    console.error("录制失败:", err);
                    statusEl.textContent = "录制取消或失败：" + err.message;
                    statusEl.style.color = "#ff4d4f";
                    toggle.style.display = "flex";
                }
            }

            function stopRecording() {
                clearTimeout(recordTimer);
                clearInterval(countdownTimer);
                if (mediaRecorder && mediaRecorder.state !== "inactive") {
                    mediaRecorder.stop();
                }
            }

            function formatTime(sec) {
                const m = Math.floor(sec / 60);
                const s = sec % 60;
                return (m > 0 ? m + "分" : "") + s + "秒";
            }
        })();

        // ============ 入口 =============
        document.addEventListener("DOMContentLoaded", () => renderProduct(productData));
    </script>

</body>

</html>
