<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d12" />
    <meta
      name="description"
      content="星演 PPT Studio：输入大纲、切换风格、实时预览并导出可编辑的 PowerPoint。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="星演 PPT Studio · 多风格演示文稿生成器" />
    <meta property="og:description" content="输入大纲，选择风格，导出可编辑 PPTX。全部内容在浏览器本地处理。" />
    <meta id="ogUrl" property="og:url" content="/" />
    <meta id="ogImage" property="og:image" content="/og.png" />
    <meta property="og:image:alt" content="星演 PPT Studio 多风格演示文稿编辑器" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="星演 PPT Studio · 多风格演示文稿生成器" />
    <meta name="twitter:description" content="输入大纲，选择风格，导出可编辑 PPTX。" />
    <meta id="twitterImage" name="twitter:image" content="/og.png" />
    <script>
      (() => {
        const pageUrl = new URL(location.pathname, location.origin).href;
        const imageUrl = new URL("./og.png", pageUrl).href;
        document.querySelector("#ogUrl").content = pageUrl;
        document.querySelector("#ogImage").content = imageUrl;
        document.querySelector("#twitterImage").content = imageUrl;
      })();
    </script>
    <title>星演 PPT Studio · 多风格演示文稿生成器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="星演 PPT Studio 首页">
          <span class="brand-mark" aria-hidden="true"><i></i><b>S</b></span>
          <span>
            <strong>星演</strong>
            <small>PPT STUDIO</small>
          </span>
        </a>

        <div class="topbar-center" aria-label="项目状态">
          <span class="status-dot"></span>
          <span id="saveStatus">更改会自动保存在本机</span>
        </div>

        <div class="topbar-actions">
          <input id="importInput" type="file" accept=".txt,.md,.json,text/plain,application/json" hidden />
          <button class="button button-ghost" id="importButton" type="button">
            <span class="button-icon" aria-hidden="true">↥</span>
            导入内容
          </button>
          <button class="button button-primary" id="exportButton" type="button">
            <span class="button-icon" aria-hidden="true">⇩</span>
            <span id="exportLabel">导出 PPTX</span>
          </button>
        </div>
      </header>

      <main class="workspace">
        <aside class="editor-panel" aria-label="PPT 内容与风格设置">
          <section class="panel-section intro-section">
            <div class="eyebrow">CREATE A DECK</div>
            <h1>把想法，排成一套<br />有节奏的演示。</h1>
            <p>输入大纲，选择风格。所有内容仅在浏览器本地处理。</p>
          </section>

          <section class="panel-section form-section">
            <div class="section-heading">
              <div>
                <span class="step-index">01</span>
                <h2>演示内容</h2>
              </div>
              <button class="text-button" id="exampleButton" type="button">填入示例</button>
            </div>

            <label class="field">
              <span>主标题</span>
              <input id="titleInput" type="text" maxlength="60" autocomplete="off" />
            </label>

            <label class="field">
              <span>副标题</span>
              <input id="subtitleInput" type="text" maxlength="100" autocomplete="off" />
            </label>

            <div class="field-row">
              <label class="field">
                <span>演讲者 / 品牌</span>
                <input id="presenterInput" type="text" maxlength="32" autocomplete="off" />
              </label>
              <label class="field field-compact">
                <span>结尾页</span>
                <span class="switch-wrap">
                  <input id="closingInput" type="checkbox" />
                  <span class="switch" aria-hidden="true"></span>
                  <span>自动添加</span>
                </span>
              </label>
            </div>

            <label class="field">
              <span class="field-label-row">
                <span>内容大纲</span>
                <span id="outlineMeta">0 个章节</span>
              </span>
              <textarea
                id="outlineInput"
                rows="13"
                spellcheck="false"
                placeholder="# 第一章&#10;- 每行一个要点&#10;- 最多建议 5 条&#10;&#10;# 第二章&#10;- 继续输入内容"
              ></textarea>
            </label>

            <div class="format-hint">
              <span class="hint-badge">#</span>
              <span>用“# 标题”新建章节，用“- 要点”添加正文；内容过长会自动分页。</span>
            </div>
          </section>

          <section class="panel-section asset-section">
            <div class="section-heading compact-heading">
              <div>
                <span class="step-index">02</span>
                <h2>封面图片</h2>
              </div>
              <button class="text-button is-hidden" id="removeImageButton" type="button">移除</button>
            </div>
            <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" hidden />
            <button class="image-dropzone" id="imageDropzone" type="button">
              <span class="upload-orb" aria-hidden="true">＋</span>
              <span>
                <strong id="imageDropTitle">上传一张封面图</strong>
                <small id="imageDropMeta">PNG、JPG 或 WebP，最大 10 MB</small>
              </span>
            </button>
          </section>

          <section class="panel-section theme-section">
            <div class="section-heading compact-heading">
              <div>
                <span class="step-index">03</span>
                <h2>选择风格</h2>
              </div>
              <span class="theme-count">6 STYLES</span>
            </div>
            <div class="theme-grid" id="themeGrid" role="list" aria-label="PPT 风格"></div>
          </section>

          <div class="privacy-note">
            <span aria-hidden="true">⌁</span>
            <p><strong>无需上传服务器</strong>，文字和图片都在你的浏览器中完成处理。</p>
          </div>
        </aside>

        <section class="preview-panel" aria-label="幻灯片预览">
          <div class="preview-toolbar">
            <div class="preview-title">
              <span class="live-badge"><i></i> LIVE PREVIEW</span>
              <span class="toolbar-divider"></span>
              <strong id="currentThemeName">星海霓虹</strong>
            </div>
            <div class="preview-controls">
              <button class="icon-button" id="previousButton" type="button" aria-label="上一页">←</button>
              <span class="page-counter"><b id="currentPage">01</b><i>/</i><span id="totalPages">01</span></span>
              <button class="icon-button" id="nextButton" type="button" aria-label="下一页">→</button>
            </div>
          </div>

          <div class="canvas-area">
            <div class="canvas-halo" aria-hidden="true"></div>
            <div class="slide-frame">
              <div id="slideStage" class="slide-stage" aria-live="polite"></div>
            </div>
          </div>

          <div class="thumbs-wrap">
            <div class="thumbs-heading">
              <span>页面导航</span>
              <span id="deckSummary">共 1 页</span>
            </div>
            <div class="thumb-strip" id="thumbStrip" role="listbox" aria-label="幻灯片页面"></div>
          </div>

          <div class="preview-footer">
            <span><kbd>←</kbd><kbd>→</kbd> 切换页面</span>
            <span>16:9 · 可编辑文字与图形 · 本地生成</span>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
